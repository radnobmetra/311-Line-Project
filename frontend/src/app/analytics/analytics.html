<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Admin Dashboard</title>
  </head>
  
  <body>
    <h1>Request Lookup</h1>

    <div class="search_container">
      <label for="search">Search:</label>
      <input type="text" id="search" name="search" [(ngModel)]="searchInput" placeholder="Search by Phone Number, ID, or Request Type...">
    </div>
    <table>
        <thead>
            <tr>
                <th>Phone Number</th>
                <th>ID</th>
                <th>Request Type</th>
                <th>Create Time</th>
                <th>Update Time</th>
            </tr>
        </thead>
        <tbody>
            @for (log of filteredLogs(); track log.phoneNum) {
                <tr>
                    <td>{{ log.phoneNum }}</td>
                    <td>{{ log.id }}</td>
                    <td>{{ log.requestType }}</td>
                </tr>
            } @empty {
                <tr>
                    <td colspan="5" style="text-align: center;">No results found.</td>
                </tr>
            }

        </tbody>
    </table>

  </body>
</html>
