<div class="title-btn">
    <h1>Request Logs</h1>
    <button type="button" class="export-btn" (click)="onExport()" aria-label="Export analytics data">Export</button>
</div>
<form (submit)="$event.preventDefault()">
    <div class="search_container">
        <label for="search">Search:</label>
        <input type="text" id="search" name="search" [(ngModel)]="searchInput" placeholder="Search Table Values...">
    </div>
    <fieldset id="sort-date-fieldset">
        <legend>Sort by date</legend>
        <div>
            <label>
                <input type="radio" [formField]="sortFilterForm.sortDate" value="newest" />
                Date - newest</label>
        </div>
        <div>
            <label>
                <input type="radio" [formField]="sortFilterForm.sortDate" value="oldest" />
                Date - oldest</label>
        </div>
        <div>
            <label>
                <input type="radio" [formField]="sortFilterForm.sortDate" value="" />
                Don't sort by date</label>
        </div>
    </fieldset>

    <fieldset id="filter-date-fieldset">
        <legend>Filter by date</legend>
        <div>
            <label>After date
                <input type="date" [formField]="sortFilterForm.filterStartDate" />
            </label>
        </div>
        <div>
            <label>Before date
                <input type="date" [formField]="sortFilterForm.filterEndDate" />
            </label>
        </div>
    </fieldset>

    <fieldset>
        <legend>Filter by topic</legend>
        <div>
            <label>
                <input type="radio" value="ticket" [formField]="sortFilterForm.filterTopic" />
                Topic - ticket </label>
        </div>
        <div>
            <label>
                <input type="radio" value="general" [formField]="sortFilterForm.filterTopic" />
                Topic - general question </label>
        </div>
        <div>
            <label>
                <input type="radio" value="both" [formField]="sortFilterForm.filterTopic" />
                Topic - both (ticket and general question) </label>
        </div>
        <div>
            <label>
                <input type="radio" value="none" [formField]="sortFilterForm.filterTopic" />
                Topic - none </label>
        </div>
        <div>
            <label>
                <input type="radio" value="" [formField]="sortFilterForm.filterTopic" />
                Don't filter by topic </label>
        </div>
    </fieldset>
</form>

<table class="requests-table">
    <thead>
        <tr>
            <th scope="col">Request ID</th>
            <th scope="col">Phone Number</th>
            <th scope="col">Topic</th>
            <th scope="col">Created At</th>
            <th scope="col">Export</th>
        </tr>
    </thead>
    <tbody>
        @for (request of displayed_reqs(); track request.id) {
        <tr>
            <td>{{request.requestId}}</td>
            <td>{{request.phoneNumber}}</td>
            <td>{{request.topic}}</td>
            <td>{{request.createdAt}}</td>
            <td><input type="checkbox" (click)="toggleSelectedMsg(request.id, false)" /></td>
        </tr>
        } @empty {
        <tr>
            <td colspan="5" style="text-align: center;">No results found.</td>
        </tr>
        }
    </tbody>
</table>
