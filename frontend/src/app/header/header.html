<header class="mainHeader">
      <div class="title">
        <img class="logo" src="CityofSacLogo.png" alt="City of Sacramento Logo">
        <h2>311 Admin Dashboard</h2>
        <ul>
          <li class="pages"> <a routerLink="overview"><h4>Home</h4></a></li>
          <li class="pages"> <a routerLink="/temp"><h4>Temp</h4></a></li>
          <li class="pages"> <button (click)="logout()"><h4>Logout</h4></button></li>
        </ul>
      </div> 
      <div class="user-info">
        <img class="pfp" src="pfpIconTemp.png" alt="Profile Picture">
        <span class="username">Username</span>
        <span class="profile-setting">Profile</span>
      </div>
      <div class="notifications_container">
        <notifications/>
      </div>
</header> <!-- should make header a component as well-->
