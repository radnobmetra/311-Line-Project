<section class="messages-page">
    <h1>Messages</h1>
    @if(messages().length > 0)
    {
    <table>
        <tr>
            <th>From</th>
            <th>Message Body</th>
            <th>Timestamp</th>
        </tr>
        @for (message of messages(); track message.id) {
        <tr>
            <td>{{ message.fromNumber }}</td>
            <td>{{ message.body }}</td>
            <td>{{ message.sentAt }}</td>
        </tr>
        }
    </table>
    } @else {
    <p class="empty-state">No messages yet.</p>
    }
</section>
