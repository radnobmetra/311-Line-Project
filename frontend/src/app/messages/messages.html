<section class="messages-page">
    <div class="title-btn">
        <h1>Messages</h1>
        <button type="button" class="export-btn" (click)="onExport()" aria-label="Export messages data">Export</button>
    </div>
    <!-- Just an indent between the title and the table, don't mind this -->
    <p class="table-hint"></p>
    @if(messages().length > 0)
    {
    <table>
        <tr>
            <th>From</th>
            <th>Direction</th>
            <th>Message Body</th>
            <th>Timestamp</th>
        </tr>
        @for (message of messages(); track message.id) {
        <tr>
            <td>{{ message.fromNumber }}</td>
            <td>{{ message.direction }}</td>
            <td>{{ message.body }}</td>
            <td>{{ message.sentAt | date:'short' }}</td>
        </tr>
        }
    </table>
    } @else {
    <p class="empty-state">No messages yet.</p>
    }
</section>
