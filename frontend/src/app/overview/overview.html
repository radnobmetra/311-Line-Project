<div class="overviewHeader">
    <h1> Welcome, User</h1>
    <div class="stats">
        <h3> 15 Users Helped Today</h3>
        <h3> 6 Active Sessions</h3>
    </div>
</div>

<div class="body">


    <div class="graph">
        <h2 class="title">Ticket Progress</h2>
        <canvas id="ticketChart" priority></canvas>
    </div>

    <div class="graph">
        <h2 class="title">Latest Sessions</h2>
        <canvas id="sessionChart" priority></canvas>
        <button (click)="periodToggle('hour')">Hour</button>
        <button (click)="periodToggle('day')">Day</button>
        <button (click)="periodToggle('month')">Month</button>
        <button (click)="periodToggle('year')">Year</button>

        <div class="slider-container" style="margin-top: 15px;">
    <label>
      Range: <strong>{{ rangeUnit() }}</strong> 
      {{ periodRange() }}(s)
    </label>
    <br>
    <input 
      type="range" 
      min="1" 
      [max]="sliderMax" 
      [value]="rangeUnit()" 
      [disabled]="!isSliderAvailable"
      (input)="onSliderChange($event)"
    />
    <span *tfIf="!isSliderAvailable" style="color: gray; font-size: 0.9em;">
      (Slider unavailable for Hour/Year)
    </span>
  </div>

    </div>

    <div class="graph">
        <h2 class="title">Title</h2>
        <img class="img" src="line-graph.png" />
    </div>
</div>
