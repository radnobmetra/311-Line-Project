<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Admin Dashboard</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #121212; 
        color: #e0e0e0;
        margin: 20px;
        min-height: 100vh;
      }
      
      h1 {
        color: #ffffff;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background-color: #1e1e1e;
      }

      th, td {
        border: 1px solid #333;
        padding: 12px 15px;
        text-align: left;
      }

      th {
        background-color: #2c2c2c;
        color: #4da6ff;
        font-weight: bold;
        font-size: 1.25em;
      }

      tr:nth-child(even) {
        background-color: #252525;
      }

      .search_container {
        margin-bottom: 20px;
        width: 45%;
      }

      label {
        font-weight: bold;
      }
      
      input[type="text"] {
        background-color: #1e1e1e;
        color: #e0e0e0;
        border: 2px solid #333333; /* Width, style, color */
        border-radius: 5px; /* Rounded boarders */
        width: 100%;
        padding: 10px; /* All four sides */
        box-sizing: border-box;
      }
    </style>

  </head>
  <body>
    <h1>Admin Dashboard</h1>

    <div class="search_container">
      <label for="search">Search:</label>
      <input type="text" id="search" name="search" [(ngModel)]="searchInput" placeholder="Search by Phone Number, ID, or Request Type...">
    </div>
    <table>
        <thead>
            <tr>
                <th>Phone Number</th>
                <th>ID</th>
                <th>Request Type</th>
                <th>Create Time</th>
                <th>Update Time</th>
            </tr>
        </thead>
        <tbody>
            @for (log of filteredLogs(); track log.phoneNum) {
                <tr>
                    <td>{{ log.phoneNum }}</td>
                    <td>{{ log.id }}</td>
                    <td>{{ log.requestType }}</td>
                </tr>
            } @empty {
                <tr>
                    <td colspan="5" style="text-align: center;">No results found.</td>
                </tr>
            }

        </tbody>
    </table>

  </body>
</html>
