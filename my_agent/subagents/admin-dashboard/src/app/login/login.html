<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="utf-8"/>
        <title>Login Page</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #121212; 
                color: #e0e0e0;
                margin: 20px;
                min-height: 100vh;
            }
            
            h1 {
                color: #ffffff;
            }

            /* Styles for the email and password type input fields */
            input[type="email"], input[type="password"] {
                background-color: #1e1e1e;
                color: #e0e0e0;
                border: 2px solid #333333; /* Width, style, color */
                border-radius: 5px; /* Rounded boarders */
                width: 100%;
                padding: 10px; /* All four sides */
                box-sizing: border-box;
            }

            label {
                display: block; /* Enables margins */
                margin-bottom: 5px;
            }

            /* Styles for the login button */
            button {
                background-color: #5ba755;
                color: #ffffff;
                border: 2px solid #e0e0e0;
                border-radius: 5px;
                width: 100%;
                padding: 10px 20px; /* Top and bottom, left and right */
                margin: 5px 0;
                text-align: center;
                font-size: 16px;
                cursor: pointer;
            }

            button:hover {
                opacity: 0.8;
            }

            /* Container holds all login elements */
            .container {
                background-color: #1e1e1e;
                border-radius: 5px;
                width: 35%;
                padding: 20px;
                /* Horizontally centers the container */
                margin-left: auto;
                margin-right: auto;
            }

            /* Each element is vertically separated */
            .element { 
                margin-bottom: 20px;
            }

            .error_message {
                color: #ff0000;
                width: 50%;
                padding-top: 5px;
            }
            
        </style>
    </head>
    <body>
        <h1>Login Page</h1>
        <div class="container">
            <!--
            name: The name or identifier for the login form.
            action: The endpoint where the form input data will be submitted for processing.
            method: "POST" hides the input data from the URL, but "GET" appends it.
            #loginForm="ngForm": Creates a local reference to the form, allowing access to its properties and methods.
            (submit)="login()": Binds the form's submit event to the login() method in the component class, which will handle the login logic.
            -->
            <form name="loginForm" action="" method="POST" #loginForm="ngForm" (submit)="login()">
                <!--
                type: The type of input field (text is the default, but email and password can be used too).
                id: A unique identifier for the input field, used for labeling and scripting.
                required: Ensures that the user cannot submit the form without filling out this field.
                ngModel: Binds the input field to a property in the component class.
                -->
                <!--Email input field-->
                <div class="element">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="emailLogin" [(ngModel)]="user.email" placeholder="Your Email" required/>
                </div>
                <!--Password input field-->
                <div class="element">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="passLogin" [(ngModel)]="user.password" placeholder="Your Password" required/>
                </div>

                <!--The login button will also be disabled if the inputs are empty.-->
                <button type="submit" [disabled]="!loginForm.valid">Login</button>

            </form>
            <!--If "loginError" from login.ts is true, the hidden error message will be displayed.-->
            <label class="error_message" *ngIf="loginError">Invalid email or password.</label>
            
            
        </div>
        
    </body>

</html>
